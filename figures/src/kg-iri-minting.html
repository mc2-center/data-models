<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="output" content="docs/assets/knowledge-graph/kg-iri-minting.png">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=block" rel="stylesheet">
<style>
  :root {
    --navy: #1e293b;
    --arrow: #7b8794;
    --float-text: #7b8794;
    --float-accent: #3a8fd0;
    --gold: #c2a772;
    --white: #ffffff;
  }
  * { box-sizing: border-box; }
  html, body { background: transparent; margin: 0; padding: 0; }
  body { font-family: 'DM Sans', sans-serif; }
  .figure {
    position: relative;
    width: 980px;
    height: 480px;
    margin: 20px;
  }
  .card {
    position: absolute;
    border-radius: 8px;
    background: var(--navy);
    color: var(--white);
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    font-size: 22px;
    font-weight: 700;
    line-height: 1.3;
    padding: 0 18px;
  }
  .decision {
    background: var(--gold);
    color: var(--navy);
  }
  .branch-label {
    position: absolute;
    font-size: 19px;
    font-weight: 700;
    color: var(--float-text);
    display: flex;
    align-items: center;
  }
  .eyebrow {
    position: absolute;
    font-size: 19px;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--float-accent);
  }
  svg { position: absolute; left: 0; top: 0; overflow: visible; }
</style>
</head>
<body>
  <div class="figure">
    <svg width="980" height="480">
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
          <path d="M0,0 L6,3 L0,6 Z" fill="var(--arrow)" />
        </marker>
      </defs>
      <!-- decision stem -->
      <path d="M 490 100 L 490 130" stroke="var(--arrow)" stroke-width="2.5" fill="none" />
      <!-- yes branch -->
      <path d="M 490 130 L 190 130 L 190 170" stroke="var(--arrow)" stroke-width="2.5" fill="none" marker-end="url(#arrow)" />
      <!-- no branch -->
      <path d="M 490 130 L 790 130 L 790 170" stroke="var(--arrow)" stroke-width="2.5" fill="none" marker-end="url(#arrow)" />
      <!-- second flow arrow -->
      <line x1="470" y1="405" x2="556" y2="405" stroke="var(--arrow)" stroke-width="2.5" marker-end="url(#arrow)" />
    </svg>

    <div class="card decision" style="left:310px; top:10px; width:360px; height:90px;">Row has a Synapse ID?</div>
    <div class="branch-label" style="left:120px; top:138px; width:58px; height:24px; justify-content:flex-end;">yes</div>
    <div class="branch-label" style="left:720px; top:138px; width:58px; height:24px; justify-content:flex-end;">no</div>

    <div class="card" style="left:40px; top:170px; width:300px; height:110px;">Synapse's own URL</div>
    <div class="card" style="left:640px; top:170px; width:300px; height:110px;">Pipeline placeholder IRI</div>

    <div class="eyebrow" style="left:0px; top:310px;">SEPARATELY, FOR VOCABULARY VALUES</div>

    <div class="card" style="left:0px; top:350px; width:450px; height:110px;">Vocabulary value confirmed to have no ontology term</div>
    <div class="card" style="left:560px; top:350px; width:300px; height:110px;">Provisional term IRI</div>
  </div>
</body>
</html>
