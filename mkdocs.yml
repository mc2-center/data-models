# Project
site_name: "MC2 Center Data Models Explorer"
site_description: >-
  Versioned history of the MC2 Center data models.

# Repository
repo_url: https://github.com/mc2-center/data-models
repo_name: data-models

# Report links to missing in-page anchors as warnings, so `mkdocs build
# --strict` (docs-check.yml) fails on a dead "View" link to a standard-terms
# anchor rather than only logging it at INFO level.
validation:
  anchors: warn

# Navigation - see nav.yml to edit the actual navigation
nav:
  - index.md

# Theme configuration
theme:
  name: material
  font:
    text: DM Sans
  palette:
    - media: "(prefers-color-scheme: light)" 
      scheme: default
      primary: indigo
      toggle:
        icon: material/toggle-switch-off-outline
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)" 
      scheme: slate
      primary: deep purple
      toggle:
        icon: material/toggle-switch
        name: Switch to light mode
  logo: assets/cckp-logo.png
  icon:
    admonition:
      note: octicons/tag-16
      info: octicons/info-16
  features:
    - content.code.copy
    - navigation.indexes
    - navigation.sections
    - navigation.tabs
    - navigation.tabs.sticky
    - search.highlight
    - search.share
    - search.suggest
    - toc.follow

plugins:
- search
- table-reader:
    data_path: "modules"
    select_readers:
      - read_csv

hooks:
  - scripts/hooks.py

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - toc:
      permalink: true
